name: Grain
description: Grain is a Singapore-based online restaurant and catering company founded in 2013 that delivers
  freshly prepared, thoughtfully sourced meals across Singapore. Its products include Meals On Demand (same-day
  ready-to-eat delivery), wedding catering, event catering, gift cards, and the Grain Savers program, with
  MUIS Halal and ISO certifications. Grain was surfaced in the API Evangelist network as a VC-portfolio stub
  (500 Global among its early backers). As of this enrichment pass it publishes a consumer web storefront but
  no public API, developer portal, OpenAPI, or other machine-readable API artifacts, so this profile captures
  company identity and domain-security posture only.
